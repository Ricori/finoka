[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finoka"
version = "0.1.4"
description = "Local-first subtitle production with a vendored FineSub engine"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[project.scripts]
finoka-sidecar = "finoka.sidecar:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["finoka*"]

[tool.setuptools.package-data]
finoka = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
