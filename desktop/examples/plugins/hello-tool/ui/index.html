<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Tool</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f111b;
      --panel: #191c2d;
      --raised: #252a42;
      --line: #363c59;
      --text: #f5f2fb;
      --mut: #aeaac6;
      --accent: #9caef7;
      --on-accent: #1b2140;
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; color: var(--text); background: var(--bg); }
    body.light {
      --bg: #faf9fe;
      --panel: #fff;
      --raised: #f0ecf8;
      --line: #ded8ea;
      --text: #383344;
      --mut: #5f5a6e;
      --accent: #6b4fd0;
      --on-accent: #fff;
    }
    main { max-width: 720px; margin: 0 auto; border: 1px solid var(--line); border-radius: 16px; padding: 24px; background: var(--panel); }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { color: var(--mut); line-height: 1.7; }
    button, select { border: 0; border-radius: 9px; padding: 9px 13px; font: inherit; }
    button { background: var(--accent); color: var(--on-accent); font-weight: 700; cursor: pointer; }
    select { min-width: 280px; margin: 12px 0; background: var(--raised); color: inherit; }
    #result { margin-top: 14px; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>插件已经挂载成功</h1>
    <p>这个页面运行在隔离 iframe 中，只能通过 <code>window.nonoka.post()</code> 与宿主通信。</p>
    <button id="info">读取宿主信息</button>
    <button id="media">读取媒体库</button>
    <div><select id="media-list"><option value="">请先读取媒体库</option></select></div>
    <button id="audio">用 Nonoka X FFmpeg 导出 WAV</button>
    <div id="result"></div>
  </main>
  <script>
    const result = document.querySelector("#result");
    const mediaList = document.querySelector("#media-list");
    document.querySelector("#info").addEventListener("click", () => {
      window.nonoka.post("host.getInfo", {}, "info-1");
    });
    document.querySelector("#media").addEventListener("click", () => {
      window.nonoka.post("media.list", {}, "media-1");
    });
    document.querySelector("#audio").addEventListener("click", () => {
      if (!mediaList.value) return;
      window.nonoka.post("ffmpeg.extractAudio", { mediaId: mediaList.value, format: "wav" }, "audio-1");
    });
    window.addEventListener("message", (event) => {
      if (event.data?.source !== "nonoka-host" || event.data?.method !== "host.info") return;
      const light = event.data.result.theme === "light";
      document.body.classList.toggle("light", light);
      document.documentElement.style.colorScheme = light ? "light" : "dark";
      result.textContent = JSON.stringify(event.data.result, null, 2);
      return;
    });
    window.addEventListener("message", (event) => {
      if (event.data?.source !== "nonoka-host" || event.data?.method !== "rpc.result") return;
      if (event.data.error) {
        result.textContent = event.data.error;
        return;
      }
      if (event.data.id === "media-1") {
        mediaList.replaceChildren(...event.data.result.map((item) => new Option(item.title, item.id)));
      }
      result.textContent = JSON.stringify(event.data.result, null, 2);
    });
  </script>
</body>
</html>
