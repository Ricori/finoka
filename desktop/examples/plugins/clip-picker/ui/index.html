<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选片小助手</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f111b;
      --panel: #191c2d;
      --line: #363c59;
      --text: #f5f2fb;
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif;
    }
    body.light {
      --bg: #faf9fe;
      --panel: #fff;
      --line: #ded8ea;
      --text: #383344;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; color: var(--text); background: var(--bg); font-size: 14px; }
    main { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 16px; font-size: 20px; }
    .box { border: 1px solid var(--line); border-radius: 14px; padding: 18px; background: var(--panel); min-height: 160px; }
  </style>
</head>
<body>
  <main>
    <h1>选片小助手</h1>
    <section class="box" id="box"></section>
  </main>

  <script>
    // 插件页是独立文档，读不到宿主的 CSS 变量，主题得自己切。原生控件跟的是
    // color-scheme，不一起切的话浅色主题下拉框会是一块突兀的深色。
    window.addEventListener("message", (event) => {
      if (event.data?.source !== "nonoka-host" || event.data?.method !== "host.info") return;
      const light = event.data.result.theme === "light";
      document.body.classList.toggle("light", light);
      document.documentElement.style.colorScheme = light ? "light" : "dark";
    });

    window.nonoka.post("host.getInfo", {});
  </script>
</body>
</html>
